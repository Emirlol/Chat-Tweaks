[versions]
modVersion = "2.0.0-alpha.1"

# Required stuff, https://fabricmc.net/develop/
minecraft = "1.21.4"
yarnMappings = "1.21.4+build.8"
fabricLoader = "0.16.10"
fabricApi = "0.115.0+1.21.4"

fabricLanguageKotlin = "1.13.0+kotlin.2.1.0" # https://github.com/FabricMC/fabric-language-kotlin/releases

datafaker = "2.4.2" # https://github.com/datafaker-net/datafaker/releases

# Plugins
kotlin = "2.1.0" # Match this to the one above
loom = "1.9-SNAPSHOT" # https://github.com/FabricMC/fabric-loom/releases
modPublish = "0.8.3" # https://github.com/modmuss50/mod-publish-plugin

# Other dependencies
modMenu = "13.0.1" # https://github.com/TerraformersMC/ModMenu/releases
yacl = "3.6.2+1.21.4-fabric" # https://modrinth.com/mod/yacl/versions
mcdevannotations = "2.1.0" # https://github.com/minecraft-dev/annotations/releases
adventure = "6.2.0" #https://github.com/KyoriPowered/adventure-platform-mod

devauth = "1.2.1" # https://github.com/DJtheRedstoner/DevAuth/releases

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabricLoader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
fabricLanguageKotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabricLanguageKotlin" }
fabricApi = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricApi" }
modMenu = { module = "com.terraformersmc:modmenu", version.ref = "modMenu" }
yacl = { module = "dev.isxander:yet-another-config-lib", version.ref = "yacl" }
devauth = { module = "me.djtheredstoner:DevAuth-fabric", version.ref = "devauth" }
mcdevannotations = { module = "com.demonwav.mcdev:annotations", version.ref = "mcdevannotations" }
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }
adventure = { module = "net.kyori:adventure-platform-mod-shared-fabric-repack", version.ref = "adventure" }

[bundles]


[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
loom = { id = "fabric-loom", version.ref = "loom" }
modPublish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "modPublish" }